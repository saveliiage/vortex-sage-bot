# Docker Compose — Vortex Bot + PostgreSQL + Local Bot API
# 
# First deploy:
#   cp .env.example .env
#   nano .env
#   docker compose up -d --build
#
# Update:
#   git pull --ff-only origin main
#   docker compose up -d --build
#
# Stop:  docker compose down
# Logs:  docker compose logs -f bot

services:
  bot:
    build: .
    container_name: vortex-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - VORTEX_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-vortex}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-vortex}
      - DOWNLOAD_DIR=/app/downloads
      - VAULT_PATH=/app/vault
      - TELEGRAM_BOT_API_URL=http://telegram-bot-api:8081
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
    volumes:
      - downloads:/app/downloads
      - cache:/app/cache
      - cookies:/app/cookies
      - ./backups:/app/backups
      - vault:/app/vault
    depends_on:
      postgres:
        condition: service_healthy
      telegram-bot-api:
        condition: service_started
    command: python bot.py
    healthcheck:
      test: ["CMD", "python", "-c", "import config; assert True"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    entrypoint: ""
    command: >-
      telegram-bot-api
      --api-id=${TELEGRAM_API_ID}
      --api-hash=${TELEGRAM_API_HASH}
      --local
      --dir=/var/lib/telegram-bot-api
      --temp-dir=/var/lib/telegram-bot-api/tmp
      --http-port=8081
    user: "${BOT_API_UID:-1001}:${BOT_API_GID:-1001}"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - botapi_data:/var/lib/telegram-bot-api

  postgres:
    image: postgres:16-alpine
    container_name: vortex-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vortex}
      POSTGRES_USER: ${POSTGRES_USER:-vortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vortex} -d ${POSTGRES_DB:-vortex}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    name: vortex-pgdata
  downloads:
    name: vortex-downloads
  cache:
    name: vortex-cache
  cookies:
    name: vortex-cookies
  vault:
    name: vortex-vault
  botapi_data:
    name: vortex-botapi-data